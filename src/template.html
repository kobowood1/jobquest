<title>Job Quest Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: full-bleed 3D map as the stage; a chunky sticker-style filter bar on top, a comic-panel drawer on the right (bottom sheet on phones). Single committed daytime-cartoon look. */
:root {
  --sky: #8fd3f4;
  --sea: #5fbde8;
  --ink: #1d2b53;
  --paper: #fffaf0;
  --sun: #ffcf3f;
  --coral: #ff6b6b;
  --muted: #5b6585;
  --line: #1d2b53;
  --display: "Luckiest Guy", "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --c-software: #ff6b6b; --c-ai: #8a63ff; --c-hardware: #ffa62b; --c-product: #23b5a6; --c-quant: #3a86ff;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; touch-action: none; cursor: grab; }
#stage canvas.pointing { cursor: pointer; }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 12px; background: var(--paper); border: 3px solid var(--line); border-radius: 18px;
  padding: 6px 16px 4px 10px; box-shadow: 5px 5px 0 var(--line); transform: rotate(-1.5deg); animation: wobble-in .7s cubic-bezier(.3,1.6,.5,1) both; }
.brand .logo { width: 40px; height: 40px; flex: none; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3.4vw, 32px); margin: 0; letter-spacing: .02em; line-height: 1;
  color: var(--coral); -webkit-text-stroke: 1.5px var(--ink); text-shadow: 2px 2px 0 var(--ink); }
.brand .sub { font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.1; margin-top: 2px; }
.brand .sub b { color: var(--ink); font-variant-numeric: tabular-nums; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: min(760px, calc(100vw - 420px)); }
.chip { font-family: var(--body); font-weight: 800; font-size: 14px; border: 2.5px solid var(--line); border-radius: 999px; padding: 4px 12px 2px;
  background: var(--paper); color: var(--ink); cursor: pointer; box-shadow: 3px 3px 0 var(--line); display: inline-flex; align-items: center; gap: 6px;
  transition: transform .15s cubic-bezier(.3,1.8,.5,1), box-shadow .15s, background .15s; }
.chip:hover { transform: translateY(-2px) rotate(-2deg); }
.chip:active { transform: translate(2px, 2px) scale(.94); box-shadow: 1px 1px 0 var(--line); }
.chip[aria-pressed="true"] { background: var(--sun); }
.chip .dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--line); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .7; font-size: 12px; }
.chip:focus-visible, select:focus-visible, input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px dashed var(--coral); outline-offset: 2px; }
select.chip { appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
select.chip[data-on="true"] { background-color: var(--sun); }
.search { display: flex; align-items: center; gap: 6px; border: 2.5px solid var(--line); border-radius: 999px; background: var(--paper); padding: 2px 6px 0 12px; box-shadow: 3px 3px 0 var(--line); }
.search input { border: 0; background: transparent; font-family: var(--body); font-weight: 700; font-size: 14px; color: var(--ink); width: 170px; outline: none; padding: 4px 0 2px; }
.search input::placeholder { color: var(--muted); }
.search svg { flex: none; }

/* drawer */
.drawer { position: fixed; z-index: 6; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: 380px; display: flex; flex-direction: column; background: var(--paper); border: 3px solid var(--line); border-radius: 22px; box-shadow: 7px 7px 0 var(--line);
  animation: slide-in .6s .2s cubic-bezier(.3,1.4,.5,1) both; overflow: hidden; }
.drawer header { padding: 14px 16px 10px; border-bottom: 3px solid var(--line); background: var(--sun); position: relative; }
.drawer .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); opacity: .75; }
.drawer h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 2px 0 0; line-height: 1.05; letter-spacing: .02em; text-wrap: balance; }
.drawer .meta { font-weight: 700; font-size: 14px; color: var(--ink); margin-top: 2px; }
.drawer .meta b { font-variant-numeric: tabular-nums; }
.back { position: absolute; top: 12px; right: 12px; font: 800 13px var(--body); border: 2.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 3px 10px 1px; cursor: pointer; box-shadow: 2px 2px 0 var(--line); transition: transform .15s cubic-bezier(.3,1.8,.5,1); }
.back:hover { transform: rotate(4deg) scale(1.05); }
.tabs { display: flex; gap: 6px; padding: 10px 16px 0; }
.tab { font: 800 14px var(--body); border: 2.5px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; background: #f1ead8; padding: 4px 14px 2px; cursor: pointer; color: var(--ink); }
.tab[aria-selected="true"] { background: var(--paper); transform: translateY(1px); }
.mix { display: flex; height: 12px; border: 2.5px solid var(--line); border-radius: 999px; overflow: hidden; margin-top: 8px; background: var(--paper); }
.mix span { height: 100%; transition: width .5s cubic-bezier(.3,1.4,.5,1); }
.list { flex: 1; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; border-top: 2.5px solid var(--line); min-height: 0; }
.list.notabs { border-top: 0; }
.row { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; text-align: left; width: 100%; font: 700 15px var(--body); color: var(--ink);
  background: #fff; border: 2.5px solid var(--line); border-radius: 14px; padding: 7px 10px 5px; cursor: pointer; box-shadow: 3px 3px 0 var(--line);
  transition: transform .18s cubic-bezier(.3,1.8,.5,1), box-shadow .18s; animation: pop .4s cubic-bezier(.3,1.6,.5,1) both; }
.row:hover { transform: translate(-2px, -2px) rotate(-.6deg); box-shadow: 5px 5px 0 var(--line); }
.row .rank { font-family: var(--display); font-size: 18px; color: var(--coral); -webkit-text-stroke: .6px var(--ink); }
.row .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .name small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
.row .cnt { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.job { background: #fff; border: 2.5px solid var(--line); border-radius: 16px; padding: 10px 12px 8px; box-shadow: 3px 3px 0 var(--line); display: grid; gap: 4px;
  animation: pop .4s cubic-bezier(.3,1.6,.5,1) both; transition: transform .18s cubic-bezier(.3,1.8,.5,1); position: relative; }
.job:hover { transform: rotate(-.7deg) translateY(-2px); }
.job .co { font-weight: 800; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.job .co i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.job .ti { font-weight: 800; font-size: 16px; line-height: 1.2; text-wrap: pretty; overflow-wrap: anywhere; }
.job .ft { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.tag { border: 2px solid var(--line); border-radius: 999px; padding: 1px 8px 0; background: #f1ead8; color: var(--ink); }
.tag.new { background: #c9f7d5; }
.apply { margin-left: auto; font: 800 13px var(--body); text-decoration: none; color: var(--ink); background: var(--sun); border: 2.5px solid var(--line); border-radius: 999px; padding: 2px 12px 0; box-shadow: 2px 2px 0 var(--line); transition: transform .15s cubic-bezier(.3,1.8,.5,1); }
.apply:hover { transform: scale(1.08) rotate(-3deg); }
.more { font: 800 14px var(--body); border: 2.5px dashed var(--line); background: transparent; border-radius: 14px; padding: 8px; cursor: pointer; color: var(--ink); }
.empty { text-align: center; padding: 24px 8px; font-weight: 700; color: var(--muted); }
.empty b { display: block; font-family: var(--display); font-weight: 400; font-size: 24px; color: var(--ink); }
.foot { font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 8px 16px 10px; border-top: 2.5px solid var(--line); background: #f8f1df; line-height: 1.35; }
.foot a { color: var(--ink); }


/* job-type switch */
.modes { display: flex; gap: 0; border: 3px solid var(--line); border-radius: 16px; background: var(--paper); box-shadow: 4px 4px 0 var(--line); overflow: hidden; animation: wobble-in .7s .1s cubic-bezier(.3,1.6,.5,1) both; }
.mode { font: 400 17px var(--display); letter-spacing: .03em; color: var(--ink); background: transparent; border: 0; border-right: 2.5px solid var(--line); padding: 8px 14px 4px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; transition: background .2s, transform .15s cubic-bezier(.3,1.8,.5,1); }
.mode:last-child { border-right: 0; }
.mode .n { font: 800 12px var(--body); opacity: .65; font-variant-numeric: tabular-nums; }
.mode:hover { background: #f1ead8; }
.mode:active { transform: scale(.94); }
.mode[aria-selected="true"] { background: var(--mode-col); }
.mode[aria-selected="true"] .n { opacity: .9; }
:root { --mode-col: var(--sun); }
:root[data-mode="startup"] { --mode-col: #ff9ec8; }
:root[data-mode="h1b"] { --mode-col: #8fe3c4; }
.drawer header { transition: background .3s; background: var(--mode-col) !important; }
.chip.toggle .tick { width: 14px; height: 14px; border: 2.5px solid var(--line); border-radius: 5px; background: #fff; display: inline-grid; place-items: center; }
.chip.toggle[aria-pressed="true"] .tick::after { content: ""; width: 6px; height: 3px; border: solid var(--ink); border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg) translate(1px, -1px); }
.job .co .where { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.job .stack { font-size: 13px; font-weight: 700; color: var(--ink); opacity: .8; overflow-wrap: anywhere; }
.job .note { font-size: 12.5px; font-weight: 600; color: var(--muted); flex: 1; min-width: 0; }
.tag.pay { background: #ffe9a8; }

/* floating labels & tooltip */
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.lbl { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; font: 800 13px var(--body); background: var(--paper); border: 2.5px solid var(--line); border-radius: 12px;
  padding: 2px 8px 0; white-space: nowrap; box-shadow: 2px 2px 0 var(--line); transition: opacity .25s; will-change: transform; }
.lbl b { font-family: var(--display); font-weight: 400; color: var(--coral); margin-left: 4px; -webkit-text-stroke: .5px var(--ink); font-variant-numeric: tabular-nums; }
.lbl::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -6px; border: 6px solid transparent; border-top-color: var(--line); border-bottom: 0; }
.lbl.remote { background: var(--sun); }
#tip { position: fixed; z-index: 8; pointer-events: none; left: 0; top: 0; background: var(--ink); color: var(--paper); font: 700 14px var(--body); border-radius: 12px;
  padding: 6px 10px 4px; box-shadow: 3px 3px 0 rgba(29,43,83,.35); opacity: 0; transform: scale(.6); transition: opacity .15s, transform .2s cubic-bezier(.3,1.8,.5,1); white-space: nowrap; }
#tip.on { opacity: 1; transform: scale(1); }
#tip small { display: block; font-size: 12px; opacity: .8; font-weight: 600; }

.fly { font: 800 13px var(--body); border: 2.5px solid var(--line); background: var(--sun); color: var(--ink); border-radius: 999px; padding: 2px 10px 0; cursor: pointer; box-shadow: 2px 2px 0 var(--line); transition: transform .15s cubic-bezier(.3,1.8,.5,1); }
.fly:hover { transform: rotate(-4deg) scale(1.06); }
.fly:active { transform: translate(2px, 2px) scale(.94); box-shadow: 0 0 0 var(--line); }
.hint { position: fixed; z-index: 4; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  font: 700 13px var(--body); background: var(--paper); border: 2.5px solid var(--line); border-radius: 999px; padding: 4px 12px 2px; box-shadow: 3px 3px 0 var(--line);
  display: flex; gap: 12px; align-items: center; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; }
.legend span { display: inline-flex; gap: 4px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); }

#loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--sky); transition: opacity .5s; }
#loading div { font-family: var(--display); font-size: 30px; color: var(--paper); -webkit-text-stroke: 1.5px var(--ink); text-shadow: 3px 3px 0 var(--ink); animation: bob 1s ease-in-out infinite; }
#fallback { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; font-weight: 700; z-index: 1; }

@keyframes wobble-in { from { transform: rotate(-12deg) scale(.4); opacity: 0; } to { transform: rotate(-1.5deg) scale(1); opacity: 1; } }
@keyframes slide-in { from { transform: translateX(120%) rotate(6deg); } to { transform: none; } }
@keyframes pop { from { transform: scale(.85) translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-3deg); } }

@media (max-width: 860px) {
  .filters { max-width: calc(100vw - 32px); flex-wrap: nowrap; overflow-x: auto; padding: 2px 4px 8px 0; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip, .search { flex: none; }
  .drawer { top: auto; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); width: auto; height: 44%; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); animation-name: slide-up; }
  .hint { display: none; }
  .mode { font-size: 14px; padding: 7px 9px 3px; }
  .mode .n { display: none; }
  .modes { max-width: calc(100vw - 32px); }
  .brand { transform: none; }
  .drawer h2 { font-size: 23px; }
}
@keyframes slide-up { from { transform: translateY(120%); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>

<div id="stage"></div>
<div id="fallback" hidden>The 3D map needs WebGL. The list panel still works.</div>
<div id="labels" aria-hidden="true"></div>
<div id="tip" role="status"></div>
<div id="loading"><div>Inflating the map…</div></div>

<div class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 37c-1-6-11-12-11-21a11 11 0 0 1 22 0c0 9-10 15-11 21z" fill="#ff6b6b" stroke="#1d2b53" stroke-width="2.6" stroke-linejoin="round"/><circle cx="20" cy="16" r="4.5" fill="#fffaf0" stroke="#1d2b53" stroke-width="2.4"/><path d="M13 9c1.5-2 3.5-3 6-3" stroke="#fffaf0" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
    <div>
      <h1>Job Quest Map</h1>
      <div class="sub" id="sub"></div>
    </div>
  </div>
  <div class="modes" id="modes" role="tablist" aria-label="Job type"></div>
  <div class="filters" role="toolbar" aria-label="Filters">
    <div id="cats" style="display:contents"></div>
    <select class="chip" id="term" aria-label="Season"></select>
    <select class="chip" id="age" aria-label="Posted within">
      <option value="0">Any date</option><option value="3">Last 3 days</option><option value="7">Last week</option><option value="30">Last 30 days</option>
    </select>
    <button class="chip toggle" id="remote" aria-pressed="false" hidden><i class="tick" aria-hidden="true"></i>Remote only</button>
    <button class="chip toggle" id="grads" aria-pressed="false" hidden><i class="tick" aria-hidden="true"></i>Hires new grads</button>
    <label class="search"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="#1d2b53" stroke-width="2.4"/><path d="M11 11l3.5 3.5" stroke="#1d2b53" stroke-width="2.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Company or role…" aria-label="Search company or role" autocomplete="off"></label>
  </div>
</div>

<aside class="drawer" aria-live="polite">
  <header>
    <div class="eyebrow" id="d-eyebrow">The whole map</div>
    <h2 id="d-title">Where the internships are</h2>
    <div class="meta" id="d-meta"></div>
    <div class="mix" id="d-mix" aria-hidden="true"></div>
    <button class="back" id="d-back" hidden>Back to map</button>
  </header>
  <div class="tabs" id="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-cities" aria-selected="true">Cities</button>
    <button class="tab" role="tab" id="tab-states" aria-selected="false">States</button>
    <button class="tab" role="tab" id="tab-new" aria-selected="false">Newest</button>
  </div>
  <div class="list" id="list"></div>
  <div class="foot" id="foot"></div>
</aside>

<div class="hint"><span>Drag to spin · scroll to zoom · click a pin</span><button class="fly" id="fly">Send the plane</button><button class="fly" id="toot">Toot the boat</button><span class="legend" id="legend"></span></div>

<script>const D = __DATA__;</script>
<script>
(() => {
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ABBR = {AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',DC:'District of Columbia',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming'};
const TODAY = Math.floor(Date.now() / 86400000);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const fmt = (ms, o) => new Date(ms).toLocaleDateString(undefined, o || { month: 'short', day: 'numeric', year: 'numeric' });
const ago = d => { const n = TODAY - d; return n <= 0 ? 'today' : n === 1 ? '1 day ago' : n < 30 ? n + ' days ago' : n < 365 ? Math.round(n / 30) + ' mo ago' : 'over a year ago'; };
const termLabel = t => t === 'N/A' ? 'Rolling' : t;

// ---------- the three job types ----------
const startupDays = D.modes.startup.map(j => j.day);
const sFrom = fmt(Math.min(...startupDays) * 86400000, { month: 'short', day: 'numeric' }), sTo = fmt(Math.max(...startupDays) * 86400000, { month: 'short', day: 'numeric', year: 'numeric' });
const MODES = {
  intern: { hash: 'internships', label: 'Internships', one: 'internship', many: 'internships', unit: 'open', remoteName: 'Remote / anywhere in US',
    cats: [['Software', '#ff6b6b'], ['AI/ML/Data', '#8a63ff'], ['Hardware', '#ffa62b'], ['Product', '#23b5a6'], ['Quant', '#3a86ff']],
    sub: n => `<b>${n}</b> open US tech internships · updated ${fmt(D.updated.intern)}`, home: 'Where the internships are', newest: 'Newest',
    foot: `Listings from the community-run <a href="https://github.com/SimplifyJobs/Summer2026-Internships" target="_blank" rel="noopener">SimplifyJobs internship list</a> on GitHub, pulled ${fmt(D.updated.intern)}. Only roles still marked open are shown. Always confirm on the company's page before applying.` },
  startup: { hash: 'startups', label: 'Startup roles', one: 'role', many: 'roles', unit: 'open', remoteName: 'Remote in the US',
    cats: [['Engineering', '#ff6b6b'], ['Data & AI', '#8a63ff'], ['Product & Design', '#23b5a6'], ['Growth & Marketing', '#f45fb0'], ['Operations', '#3a86ff'], ['Sales & Customer Success', '#4cbf55'], ['Hardware & Manufacturing', '#ffa62b']],
    sub: n => `<b>${n}</b> full-time startup roles · posted ${sFrom} – ${sTo}`, home: 'Where startups are hiring', newest: 'Newest',
    foot: `Full-time roles at venture-backed startups from the weekly startup jobs list by <a href="https://x.com/deaguiarza" target="_blank" rel="noopener">@deaguiarza</a>, posted ${sFrom} – ${sTo}. Some roles may already be filled, so check the listing before applying.` },

const T0 = performance.now();

    if (RM) ps.s = ps.t; else if (now > ps.delay) { const tgt = ps.t * (1 + ps.hov * .35); ps.v += (tgt - ps.s) * .14; ps.v *= .76; ps.s += ps.v; }

    const bob = RM ? 0 : Math.sin(t * 2 + ps.k) * .8 * s;
    const baseY = (ps.p.si != null ? stateMeshes[ps.p.si].scale.z : 6) + lift;

    const ps = l.ps; const baseY = (stateMeshes[ps.p.si] ? stateMeshes[ps.p.si].scale.z + stateMeshes[ps.p.si].position.y : 6);
